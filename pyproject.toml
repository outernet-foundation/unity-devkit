[project]
name = "unity-devkit-repo"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["unity-devkit", "basedpyright>=1.39.10", "ruff>=0.14.11", "pytest>=8.0.0", "pyyaml>=6.0.2"]

[tool.uv.workspace]
members = ["packages/python/unity-devkit"]

[tool.uv.sources]
unity-devkit = { workspace = true }

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = ["packages/python/unity-devkit/src", "packages/python/unity-devkit/tests"]

[tool.pytest.ini_options]
testpaths = ["packages/python/unity-devkit/tests"]

[tool.python-devkit.preflight]
tests = true
