name: Unity Build

on:
  workflow_call:
    inputs:
      runner-labels:
        description: JSON-encoded runs-on value (string or array) for the license/build jobs
        type: string
        default: '"ubuntu-latest"'
      build-env:
        description: Newline-separated KEY=VALUE pairs injected into the Unity build process environment
        type: string
        default: ''
    secrets:
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
      UNITY_SERIAL:
        required: true

env:
  CACHE_REGISTRY: ghcr.io/${{ github.repository }}/cache

jobs:
  prepare:
    uses: ./.github/workflows/unity-prepare.yml
    with:
      runner-labels: ${{ inputs.runner-labels }}
      matrix-command: uv run --no-sync unity-matrix
    secrets: inherit

  build-unity:
    needs: [prepare]
    name: ${{ matrix.project-name }} (${{ matrix.platform }})
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    permissions:
      contents: read
      packages: write
    container:
      image: ${{ matrix.editor-image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Wipe workspace
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          rm -rf ~/.cache/Unity

      - uses: actions/checkout@v5

      - uses: ./.github/actions/unity-container-prep
        with:
          cache-tag: ${{ needs.prepare.outputs.cache-tag }}
          github-token: ${{ github.token }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          unity-serial: ${{ secrets.UNITY_SERIAL }}

      - name: Cache UPM packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/Unity/upm
          key: unity-upm-v3-${{ matrix.platform }}-${{ hashFiles(format('{0}/Packages/manifest.json', matrix.project)) }}

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LICENSE_CACHE_TAG: ${{ needs.prepare.outputs.cache-tag }}
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          uv run --no-sync build-unity \
            --project ${{ matrix.project-name }} \
            --project-path ${{ matrix.project }} \
            --platform ${{ matrix.platform }} \
            --cache-key ${{ matrix.cache-key }} \
            --run-number ${{ github.run_number }} \
            --branch ${{ github.head_ref || github.ref_name }} \
            --registry "$CACHE_REGISTRY" \
            --build-env "$BUILD_ENV"

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.project-name }}-${{ matrix.platform }}
          path: /tmp/unity-builds/
          if-no-files-found: ignore

      - name: Upload Build Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.project-name }}-${{ matrix.platform }}-build-report
          path: ${{ matrix.project }}/Build/**/BuildReport.json
          if-no-files-found: ignore
