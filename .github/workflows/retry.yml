name: Retry

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: Run to re-run once it completes
        type: number
        required: true

permissions:
  actions: write

jobs:
  retry:
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/retry.yml@49f1cc649de1d1f53499c85f20be1a5ae49f2be8
    with:
      run-id: ${{ inputs.run-id }}
