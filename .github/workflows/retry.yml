name: Retry

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: Run to re-run once it completes
        type: number
        required: true

permissions:
  actions: write

jobs:
  retry:
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/retry.yml@3c9a852ede439e0d3a8f2d0eef9e1637dffd34db
    with:
      run-id: ${{ inputs.run-id }}
