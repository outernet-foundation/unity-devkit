name: Retry

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: Run to re-run once it completes
        type: number
        required: true

permissions:
  actions: write

jobs:
  retry:
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/retry.yml@c89057b20c0e3d1b9231492d99b0ee36cfd99491
    with:
      run-id: ${{ inputs.run-id }}
