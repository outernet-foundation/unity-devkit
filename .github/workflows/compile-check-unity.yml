name: Compile Check Unity

on:
  workflow_call:
    inputs:
      runner-labels:
        description: JSON-encoded runs-on value (string or array) for the license/compile-check jobs
        type: string
        default: '"ubuntu-latest"'
      execute-method:
        description: Optional Class.Method run in a second compile-check-unity session after the compile gate
        type: string
        default: ''
    secrets:
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
      UNITY_SERIAL:
        required: true

env:
  CACHE_REGISTRY: ghcr.io/${{ github.repository }}/cache
  UNITY_DEVKIT_VERSION: "0.1.19"

jobs:
  prepare:
    uses: ./.github/workflows/prepare-unity.yml
    with:
      runner-labels: ${{ inputs.runner-labels }}
      matrix-command: uvx --from unity-devkit==${UNITY_DEVKIT_VERSION} compile-check-unity-matrix
    secrets: inherit

  compile-check-unity:
    needs: [prepare]
    name: ${{ matrix.project-name }} (compile-check)
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    permissions:
      contents: read
      packages: write
    container:
      image: ${{ matrix.editor-image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Wipe workspace
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          rm -rf ~/.cache/Unity

      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          save-cache: "false"

      - name: Sync dependencies
        run: uv sync

      - name: Activate Unity license
        run: uvx --from unity-devkit==${UNITY_DEVKIT_VERSION} activate-unity-license --oras-push
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LICENSE_CACHE_TAG: ${{ needs.prepare.outputs.cache-tag }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

      - name: Compile check
        run: uvx --from unity-devkit==${UNITY_DEVKIT_VERSION} compile-check-unity --project ${{ matrix.project-name }}

      - name: Execute method
        if: ${{ inputs.execute-method != '' }}
        run: uvx --from unity-devkit==${UNITY_DEVKIT_VERSION} compile-check-unity --project ${{ matrix.project-name }} --execute-method ${{ inputs.execute-method }}
