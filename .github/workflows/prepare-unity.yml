name: Prepare Unity

on:
  workflow_call:
    inputs:
      runner-labels:
        description: JSON-encoded runs-on value (string or array) for the license/matrix jobs
        type: string
        default: '"ubuntu-latest"'
      matrix-command:
        description: uv run command whose stdout carries matrix=<json> and license-image=<tag> lines
        type: string
        required: true
    outputs:
      matrix:
        description: The include matrix emitted by matrix-command
        value: ${{ jobs.matrix.outputs.matrix }}
      license-image:
        description: The editor image for license activation
        value: ${{ jobs.matrix.outputs.license-image }}
      cache-tag:
        description: The license cache tag pushed by activation
        value: ${{ jobs.activate-license.outputs.cache-tag }}
    secrets:
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
      UNITY_SERIAL:
        required: true

env:
  CACHE_REGISTRY: ghcr.io/${{ github.repository }}/cache

jobs:
  matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      license-image: ${{ steps.generate.outputs.license-image }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          save-cache: "false"

      - name: Sync dependencies
        run: uv sync

      - name: Generate matrix
        id: generate
        run: ${{ inputs.matrix-command }} >> "$GITHUB_OUTPUT"

  activate-license:
    needs: [matrix]
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    permissions:
      contents: read
      packages: write
    outputs:
      cache-tag: ${{ steps.tag.outputs.value }}
    container:
      image: ${{ needs.matrix.outputs.license-image }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          save-cache: "false"

      - name: Sync dependencies
        run: uv sync

      - name: Compute license cache tag
        id: tag
        run: echo "value=$(uv run --no-sync unity-license-tag)" >> "$GITHUB_OUTPUT"

      - name: Activate Unity license
        run: uv run --no-sync activate-unity-license --oras-push
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LICENSE_CACHE_TAG: ${{ steps.tag.outputs.value }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
