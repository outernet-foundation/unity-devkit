name: Integrate

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled, ready_for_review]

concurrency:
  group: integrate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  gate:
    permissions:
      contents: write
      pull-requests: write
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/gate.yml@49f1cc649de1d1f53499c85f20be1a5ae49f2be8
  preflight:
    needs: [gate]
    if: ${{ needs.gate.outputs.mode == 'full' }}
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/preflight.yml@49f1cc649de1d1f53499c85f20be1a5ae49f2be8
  compile-check-unity:
    needs: [gate, preflight]
    if: ${{ needs.gate.outputs.mode == 'full' }}
    permissions:
      contents: read
      packages: write
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/compile-check-unity.yml@49f1cc649de1d1f53499c85f20be1a5ae49f2be8
    secrets:
      unity-email: ${{ secrets.UNITY_EMAIL }}
      unity-password: ${{ secrets.UNITY_PASSWORD }}
      unity-serial: ${{ secrets.UNITY_SERIAL }}
  release-pr-builds:
    needs: [gate, compile-check-unity]
    if: ${{ needs.gate.outputs.mode == 'full' }}
    permissions:
      contents: write
      packages: read
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/release-pr-builds.yml@49f1cc649de1d1f53499c85f20be1a5ae49f2be8
  merge-if-ready:
    needs: [gate, release-pr-builds]
    if: ${{ !cancelled() && !failure() && (needs.release-pr-builds.result == 'success' || needs.gate.outputs.mode == 'reuse') }}
    permissions:
      contents: write
      pull-requests: read
      packages: write
    concurrency:
      group: merge
      queue: max
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/merge-if-ready.yml@49f1cc649de1d1f53499c85f20be1a5ae49f2be8
    with:
      retry-workflow: retry.yml
    secrets:
      merge-bot-private-key: ${{ secrets.MERGE_BOT_APP_PRIVATE_KEY }}
