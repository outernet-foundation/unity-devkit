name: Integrate

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled, ready_for_review]

concurrency:
  group: integrate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  rebase:
    permissions:
      contents: write
      pull-requests: write
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/rebase.yml@3c9a852ede439e0d3a8f2d0eef9e1637dffd34db
  preflight:
    needs: [rebase]
    if: ${{ needs.rebase.outputs.mode == 'full' }}
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/preflight.yml@3c9a852ede439e0d3a8f2d0eef9e1637dffd34db
  compile-check-unity:
    needs: [rebase, preflight]
    if: ${{ needs.rebase.outputs.mode == 'full' }}
    permissions:
      contents: read
      packages: write
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/compile-check-unity.yml@3c9a852ede439e0d3a8f2d0eef9e1637dffd34db
    secrets:
      unity-email: ${{ secrets.UNITY_EMAIL }}
      unity-password: ${{ secrets.UNITY_PASSWORD }}
      unity-serial: ${{ secrets.UNITY_SERIAL }}
  release-pr-builds:
    needs: [rebase, compile-check-unity]
    if: ${{ needs.rebase.outputs.mode == 'full' }}
    permissions:
      contents: write
      packages: read
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/release-pr-builds.yml@3c9a852ede439e0d3a8f2d0eef9e1637dffd34db
  merge-if-ready:
    needs: [rebase, release-pr-builds]
    if: ${{ !cancelled() && !failure() && (needs.release-pr-builds.result == 'success' || needs.rebase.outputs.mode == 'reuse') }}
    permissions:
      contents: write
      pull-requests: read
      packages: write
    concurrency:
      group: merge
      queue: max
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/merge-if-ready.yml@3c9a852ede439e0d3a8f2d0eef9e1637dffd34db
    with:
      retry-workflow: retry.yml
    secrets:
      merge-bot-private-key: ${{ secrets.MERGE_BOT_APP_PRIVATE_KEY }}
