name: Integrate

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]

concurrency:
  group: integrate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/preflight.yml@f19cf7ed4889e9cea4d6cfbfd41d7c05b59fcd04

  compile-check-unity:
    needs: [preflight]
    permissions:
      contents: read
      packages: write
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/compile-check-unity.yml@f19cf7ed4889e9cea4d6cfbfd41d7c05b59fcd04
    secrets:
      unity-email: ${{ secrets.UNITY_EMAIL }}
      unity-password: ${{ secrets.UNITY_PASSWORD }}
      unity-serial: ${{ secrets.UNITY_SERIAL }}

  release-pr-builds:
    needs: [compile-check-unity]
    permissions:
      contents: write
      packages: read
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/release-pr-builds.yml@f19cf7ed4889e9cea4d6cfbfd41d7c05b59fcd04
