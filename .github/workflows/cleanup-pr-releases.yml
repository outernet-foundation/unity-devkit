name: Cleanup PR releases

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup-pr-releases:
    if: github.event.pull_request.merged == false
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/cleanup-pr-releases.yml@3c9a852ede439e0d3a8f2d0eef9e1637dffd34db
    with:
      pr-number: ${{ github.event.pull_request.number }}
