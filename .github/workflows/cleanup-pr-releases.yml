name: Cleanup PR releases

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup-pr-releases:
    if: github.event.pull_request.merged == false
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/cleanup-pr-releases.yml@49f1cc649de1d1f53499c85f20be1a5ae49f2be8
    with:
      pr-number: ${{ github.event.pull_request.number }}
