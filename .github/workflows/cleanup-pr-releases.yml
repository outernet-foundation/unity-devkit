name: Cleanup PR releases

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup-pr-releases:
    if: github.event.pull_request.merged == false
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/cleanup-pr-releases.yml@f19cf7ed4889e9cea4d6cfbfd41d7c05b59fcd04
    with:
      pr-number: ${{ github.event.pull_request.number }}
