name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Preflight
        run: uvx --from python-devkit==0.1.5 preflight-python

  manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Publish plan dry run
        run: uvx --from release-devkit==0.1.18 publish-stable --config release-devkit.json --dry-run

  compile-check:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/compile-check-unity.yml
    with:
      runner-labels: '["self-hosted","unity"]'
      execute-method: Outernet.EnvironmentFixtureSelfTest.Run
    secrets: inherit
