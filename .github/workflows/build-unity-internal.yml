name: Build Unity

on:
  workflow_call:
    inputs:
      runner-labels:
        description: JSON-encoded runs-on value (string or array) for the license/build jobs
        type: string
        default: '"ubuntu-latest"'
      environment-preset:
        description: Environment preset name (the consumer env class's Presets key); empty leaves the workspace untouched
        type: string
        default: ''
      development:
        description: Development build column
        type: boolean
        default: false
      environment-fields:
        description: Newline-separated path=value environment field overrides
        type: string
        default: ''
      version:
        description: Version string to stamp into ProjectSettings before the build; empty builds unversioned
        type: string
        default: ''
    secrets:
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
      UNITY_SERIAL:
        required: true

env:
  CACHE_REGISTRY: ghcr.io/${{ github.repository }}/cache
  BUILDS_REGISTRY: ghcr.io/${{ github.repository }}/builds
  UNITY_DEVKIT_VERSION: "0.1.20"

jobs:
  prepare:
    uses: ./.github/workflows/prepare-unity.yml
    with:
      runner-labels: ${{ inputs.runner-labels }}
      matrix-command: uvx --from unity-devkit==${UNITY_DEVKIT_VERSION} build-unity-matrix
    secrets: inherit

  ci-build-unity:
    needs: [prepare]
    name: ${{ matrix.project-name }} (${{ matrix.platform }})
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    permissions:
      contents: read
      packages: write
    container:
      image: ${{ matrix.editor-image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Wipe workspace
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          rm -rf ~/.cache/Unity

      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          save-cache: "false"

      - name: Sync dependencies
        run: uv sync

      - name: Activate Unity license
        run: uvx --from unity-devkit==${UNITY_DEVKIT_VERSION} activate-unity-license --oras-push
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LICENSE_CACHE_TAG: ${{ needs.prepare.outputs.cache-tag }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

      - name: Cache UPM packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/Unity/upm
          key: unity-upm-v3-${{ matrix.platform }}-${{ hashFiles(format('{0}/Packages/manifest.json', matrix.project)) }}

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LICENSE_CACHE_TAG: ${{ needs.prepare.outputs.cache-tag }}
          ENVIRONMENT_FIELDS_INPUT: ${{ inputs.environment-fields }}
        run: |
          uvx --from unity-devkit==${UNITY_DEVKIT_VERSION} ci-build-unity \
            --project ${{ matrix.project-name }} \
            --project-path ${{ matrix.project }} \
            --platform ${{ matrix.platform }} \
            --cache-key ${{ matrix.cache-key }} \
            --run-number ${{ github.run_number }} \
            --branch ${{ github.head_ref || github.ref_name }} \
            --registry "$CACHE_REGISTRY" \
            --builds-registry "$BUILDS_REGISTRY" \
            ${{ inputs.version && format('--version {0}', inputs.version) || '' }} \
            --environment-preset "${{ inputs['environment-preset'] }}" \
            ${{ inputs.development && '--development' || '' }} \
            --environment-fields "$ENVIRONMENT_FIELDS_INPUT"

      - name: Upload Build Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.project-name }}-${{ matrix.platform }}-build-report
          path: ${{ matrix.project }}/Build/**/BuildReport.json
          if-no-files-found: ignore
          retention-days: 1
