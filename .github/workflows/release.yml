name: Release

on:
  push:
    branches: [main, dev]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  prerelease:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: outernet-foundation/github-actions-toolkit/.github/actions/release@63b580f89b301cde5cacfe442a84e31e7788e675
        with:
          channel: dev

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: outernet-foundation/github-actions-toolkit/.github/actions/release@63b580f89b301cde5cacfe442a84e31e7788e675
        with:
          channel: stable
