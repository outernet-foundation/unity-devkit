name: Release

on:
  push:
    branches: [main, dev]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  prerelease:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: outernet-foundation/github-actions-toolkit/.github/actions/release@f19cf7ed4889e9cea4d6cfbfd41d7c05b59fcd04
        with:
          channel: dev

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: outernet-foundation/github-actions-toolkit/.github/actions/release@f19cf7ed4889e9cea4d6cfbfd41d7c05b59fcd04
        with:
          channel: stable
