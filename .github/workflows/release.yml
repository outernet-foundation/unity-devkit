name: Release

on:
  push:
    branches: [main, dev]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  prerelease:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: outernet-foundation/github-actions-toolkit/.github/actions/release@49f1cc649de1d1f53499c85f20be1a5ae49f2be8
        with:
          channel: dev

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: outernet-foundation/github-actions-toolkit/.github/actions/release@49f1cc649de1d1f53499c85f20be1a5ae49f2be8
        with:
          channel: stable
