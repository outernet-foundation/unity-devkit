name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Workaround: fetch-tags is broken with shallow clones
      - run: git fetch --tags origin

      - uses: astral-sh/setup-uv@v7

      - name: Publish
        env:
          # npm decides in silence whether to attempt the OIDC exchange; without verbose a trusted-publisher
          # mismatch surfaces as a bare ENEEDAUTH indistinguishable from a missing token
          NPM_CONFIG_LOGLEVEL: verbose
        run: uvx --from release-devkit==0.1.18 publish-stable --config release-devkit.json
