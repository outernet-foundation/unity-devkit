name: Unity Check

on:
  workflow_call:
    inputs:
      runner-labels:
        description: JSON-encoded runs-on value (string or array) for the license/check jobs
        type: string
        default: '"ubuntu-latest"'
    secrets:
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
      UNITY_SERIAL:
        required: true

env:
  CACHE_REGISTRY: ghcr.io/${{ github.repository }}/cache

jobs:
  matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      check-matrix: ${{ steps.generate.outputs.matrix }}
      license-image: ${{ steps.generate.outputs.license-image }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          save-cache: "false"

      - name: Sync dependencies
        run: uv sync

      - name: Generate check matrix
        id: generate
        run: uv run --no-sync unity-check-matrix >> "$GITHUB_OUTPUT"

  activate-license:
    needs: [matrix]
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    permissions:
      contents: read
      packages: write
    outputs:
      cache-tag: ${{ steps.tag.outputs.value }}
    container:
      image: ${{ needs.matrix.outputs.license-image }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          save-cache: "false"

      - name: Sync dependencies
        run: uv sync

      - name: Compute license cache tag
        id: tag
        run: echo "value=$(uv run --no-sync unity-license-tag)" >> "$GITHUB_OUTPUT"

      - name: Activate Unity license
        run: uv run --no-sync activate-unity-license --oras-push
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LICENSE_CACHE_TAG: ${{ steps.tag.outputs.value }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

  check-unity:
    needs: [matrix, activate-license]
    name: ${{ matrix.project-name }} (check)
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    permissions:
      contents: read
      packages: write
    container:
      image: ${{ matrix.editor-image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.check-matrix) }}
    steps:
      - name: Wipe workspace
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          rm -rf ~/.cache/Unity

      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          save-cache: "false"

      - name: Sync dependencies
        run: uv sync

      - name: Activate Unity license
        run: uv run --no-sync activate-unity-license --oras-push
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LICENSE_CACHE_TAG: ${{ needs.activate-license.outputs.cache-tag }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

      - name: Compile check
        run: uv run --no-sync check-unity --project ${{ matrix.project-name }}
