name: Unity Check

on:
  workflow_call:
    inputs:
      runner-labels:
        description: JSON-encoded runs-on value (string or array) for the license/check jobs
        type: string
        default: '"ubuntu-latest"'
      execute-method:
        description: Optional Class.Method run in a second check-unity session after the compile gate
        type: string
        default: ''
    secrets:
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
      UNITY_SERIAL:
        required: true

env:
  CACHE_REGISTRY: ghcr.io/${{ github.repository }}/cache

jobs:
  prepare:
    uses: ./.github/workflows/unity-prepare.yml
    with:
      runner-labels: ${{ inputs.runner-labels }}
      matrix-command: uv run --no-sync unity-check-matrix
    secrets: inherit

  check-unity:
    needs: [prepare]
    name: ${{ matrix.project-name }} (check)
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    permissions:
      contents: read
      packages: write
    container:
      image: ${{ matrix.editor-image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Wipe workspace
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          rm -rf ~/.cache/Unity

      - uses: actions/checkout@v5

      - uses: ./.github/actions/unity-container-prep
        with:
          cache-tag: ${{ needs.prepare.outputs.cache-tag }}
          github-token: ${{ github.token }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          unity-serial: ${{ secrets.UNITY_SERIAL }}

      - name: Compile check
        run: uv run --no-sync check-unity --project ${{ matrix.project-name }}

      - name: Execute method
        if: ${{ inputs.execute-method != '' }}
        run: uv run --no-sync check-unity --project ${{ matrix.project-name }} --execute-method ${{ inputs.execute-method }}
